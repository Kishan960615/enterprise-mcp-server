[project]
name = "enterprise-mcp-server"
version = "0.1.0"
description = "Secure, multi-tenant Model Context Protocol server for enterprise systems"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Kishan Sandran"}]
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "fastmcp>=3.2,<4",
  "greenlet>=3.2,<4",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "redis[hiredis]>=5,<7",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "sqlglot>=27,<29",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
  "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
enterprise-mcp = "enterprise_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["B008", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "sqlglot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["enterprise_mcp"]
omit = [
  "src/enterprise_mcp/__main__.py",
  "src/enterprise_mcp/demo_api.py",
]
